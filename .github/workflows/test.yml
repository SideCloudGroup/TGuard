name: Test

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Fork PRs run untrusted code, keep them off the self-hosted runner
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '"ubuntu-latest"' || '["self-hosted","linux"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"
          activate-environment: true

      - name: Install dependencies
        run: uv pip install -r requirements-dev.txt

      - name: Prepare configuration
        run: cp config.example.toml config.toml

      - name: Run tests
        run: pytest -v
