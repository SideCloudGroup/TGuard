name: Build & Push Docker (multi-arch)

on:
  push:
    branches: [dev]
    tags: ["v*"]
  schedule:
    # Weekly rebuild to pick up base image and CA certificate updates
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: [self-hosted, linux]
    outputs:
      targets: ${{ steps.targets.outputs.targets }}

    steps:
      - name: Resolve build targets
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            if [ "$REF_TYPE" = "tag" ]; then
              targets="[{\"ref\":\"$REF\",\"version\":\"$REF_NAME\"}]"
            else
              targets="[{\"ref\":\"$REF\",\"version\":\"\"}]"
            fi
          else
            latest_tag=$(git ls-remote --tags --refs --sort=-v:refname "$REPO_URL" 'v*' | head -n1 | sed 's#.*refs/tags/##')
            targets="[{\"ref\":\"refs/heads/dev\",\"version\":\"\"}"
            if [ -n "$latest_tag" ]; then
              targets="$targets,{\"ref\":\"refs/tags/$latest_tag\",\"version\":\"$latest_tag\"}"
            fi
            targets="$targets]"
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Build targets: $targets"

  test:
    needs: resolve
    runs-on: [self-hosted, linux]
    strategy:
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.targets) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.target.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Prepare configuration
        run: cp config.example.toml config.toml

      - name: Run tests
        run: pytest -v

  build:
    needs: [resolve, test]
    runs-on: [self-hosted, linux]
    strategy:
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.targets) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.target.ref }}

      - name: Set up QEMU (for cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.target.version }},enable=${{ matrix.target.version != '' }}
            type=raw,value=latest,enable=${{ matrix.target.version != '' }}
            type=raw,value=dev,enable=${{ matrix.target.version == '' }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          pull: true
          no-cache: ${{ github.event_name != 'push' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: |
          echo "✅ Pushed multi-arch image tags:"
          echo "${{ steps.meta.outputs.tags }}"
